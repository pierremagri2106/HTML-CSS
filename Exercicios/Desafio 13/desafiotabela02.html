<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 13 primeira tabela </title>

    <style>

        body{

            
            color: red;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-weight: bold;
            font-size: 50px;


        }
        table{


background-color: aqua;
border-collapse: collapse;

        }

        tr{
            border: 1px solid black;
            position: relative;
            
            height: 100px;
            
        }
        td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

    </style>



</head>
<body>
    
    <table>

        <tr>
            <td colspan="4">A</td>
            <td rowspan="4">B</td>
            
        </tr>

        <tr>
            <td rowspan="4">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            <td>J</td>
            <td>L</td>
            <td>M</td>
            
        </tr>
        <tr>
            <td colspan="4">N</td>
            
            
        </tr>






    </table>


</body>
</html>
